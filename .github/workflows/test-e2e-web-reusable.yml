name: Workflow template for web e2e tests
on:
  workflow_call:

env:
  FORCE_COLOR: 1

defaults:
  run:
    working-directory: ./packages/e2e

# The production build in a real browser, against an anvil fork of mainnet and a local mock of the
# Safe Transaction Service (packages/e2e/suites/web/global-setup.ts). Optional secret: FORK_URL.
jobs:
  test-e2e-web:
    runs-on: ubuntu-latest
    env:
      FORK_URL: ${{ secrets.FORK_URL }}
    steps:
      - uses: actions/checkout@d632683dd7b4114ad314bca15554477dd762a938 # v4.2.0
      - uses: pnpm/action-setup@eae0cfeb286e66ffb5155f1a79b90583a127a68b # v2.4.1
      - uses: actions/setup-node@0a44ba7841725637a19e28fa30b79a866c81b0a6 # v4.0.4
        with:
          node-version: 20
          cache: "pnpm"
      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
      - run: pnpm install
      - run: pnpm playwright install --with-deps chromium
      - run: pnpm --filter web build
        working-directory: .
      - run: pnpm test:web
      - uses: actions/upload-artifact@50769540e7f4bd5e21e526ee35c689e35e0d6874 # v4.4.0
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: packages/e2e/playwright-report/
          retention-days: 30
      - name: App logs
        if: always()
        run: cat ./logs/app.log || true
